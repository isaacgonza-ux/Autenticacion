services:

  oracle_db:
    image: gvenzl/oracle-xe:latest
    container_name: autenticacion-oracle
    ports:
      - "1521:1521" # Puerto estándar de Oracle
    environment:
      - ORACLE_PASSWORD=${DB_PASSWORD}
      - APP_USER=USER_AUTH
      - APP_USER_PASSWORD=${DB_PASSWORD}
    volumes:
      - oracle_data:/opt/oracle/oradata
    restart: always

  # Tu Aplicación Java
  autenticacion:
    build: .
    container_name: autenticacion-app
    ports:
      - "8081:8081"
    environment:
      # URL de conexión para Oracle (Thin driver)
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle_db:1521:xe
      SPRING_DATASOURCE_USERNAME: USER_AUTH
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.OracleDialect
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - oracle_db
    restart: always

volumes:
  oracle_data: